# Publishes a tagged release to PyPI via trusted publishing (OIDC): no API
# token is stored anywhere. Two things must be set up before a tag is pushed,
# neither of which lives in this repository, and the order matters:
#
#   1. the `pypi` GitHub environment on this repository, with its protection
#      rules (required reviewers, and a deployment-branch/tag rule limiting it
#      to `v*` tags) configured. GitHub creates a referenced environment on
#      first use with NO protection rules, so a tag pushed before this step
#      would leave an unprotected environment behind rather than fail; configure
#      the rules first, then register the publisher below.
#   2. a trusted publisher registered on PyPI for `targetprocess-py`, naming
#      this repository, this workflow file (`release.yml`) and the `pypi`
#      environment. PyPI's pending-publisher flow lets this be registered
#      before the project exists; the first publish then creates it.
#
# Until the publisher exists the workflow is inert: nothing triggers it without
# a `v*` tag, and if one were pushed the publish step would be refused at
# PyPI's door with no upload. Uploads go to PyPI only; TestPyPI is not wired.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the ancestry check below can see `main`.
          fetch-depth: 0
      # A tag can be pushed on any commit. Only a commit that reached `main`
      # through review and CI may become a release, so refuse anything else
      # before building it.
      - name: Assert the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      # The version is read from the package, not the tag (see
      # [tool.hatch.version] in pyproject.toml), so a tag that disagrees with
      # targetprocess.__version__ would publish a release whose files carry a
      # different version from the tag that produced them. Refuse it.
      - name: Assert the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          version=$(unzip -p "$wheel" '*/METADATA' | sed -n 's/^Version: //p')
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match package version ${version}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/targetprocess-py/
    permissions:
      # Mint the OIDC token PyPI's trusted publisher verifies. Scoped to this
      # job only; the build job above needs nothing beyond `contents: read`.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
