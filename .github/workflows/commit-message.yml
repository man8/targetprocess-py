# A pull request's title becomes the commit message on main (squash merge), so
# it is held to the same two commit-msg hooks a contributor gets locally, run
# over the title as if it were a message. This is its own workflow rather than a
# job in ci.yml because it must also run when the title is edited, and the
# `edited` activity type would otherwise re-run the whole CI matrix for a title
# change. A push to main has no title, and its commit was checked here while it
# was a pull request.
name: Commit message
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  commit-message:
    runs-on: ubuntu-latest
    env:
      # Handed to the script through the environment and never interpolated
      # into it: the title is contributor-controlled text.
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras
      - name: Check the pull request title as a commit message
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          uv run pre-commit run --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/pr-title.txt"
