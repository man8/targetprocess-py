name: Feature request
description: Suggest a new capability or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Tell us what you want and why.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is currently hard or impossible to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the library to do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you thought about.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the library does this touch?
      options:
        - "area: client"
        - "area: models"
        - "area: transport"
        - "area: observability"
        - "area: docs"
        - "area: ci"
        - "area: testing"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: |
        How important is this to you? P1 blocks work with no reasonable
        workaround, P2 has real impact but a workaround exists, P3 is cosmetic
        or minor.
      options:
        - "P1 — High"
        - "P2 — Medium"
        - "P3 — Low"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else? Links, mockups, related issues.
    validations:
      required: false
