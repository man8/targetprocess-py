[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "targetprocess-py"
# Single source of truth is targetprocess.__version__; hatchling reads it at
# build time (see [tool.hatch.version]), so a release bumps that one string.
dynamic = ["version"]
description = "A Python library for the TargetProcess v1 REST API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Louis Mandelstam", email = "louis@man8.com"},
]
keywords = [
    "targetprocess",
    "api",
    "rest",
    "async",
    "asyncio",
    "httpx",
    "pydantic",
    "client",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "easylimit>=0.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-recording>=0.13.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/man8/targetprocess-py"
Repository = "https://github.com/man8/targetprocess-py"
Documentation = "https://github.com/man8/targetprocess-py/blob/main/docs/USAGE.md"
Changelog = "https://github.com/man8/targetprocess-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/man8/targetprocess-py/issues"

[tool.hatch.version]
path = "src/targetprocess/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/targetprocess"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
markers = [
    "integration: hits recorded cassettes (live only when ALLOW_PROD_RECORDING=1)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Ruff >=0.16 formats Python code blocks in Markdown by default; doc examples are
# wrapped for readability in narrow views rather than to the code line length.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "D",   # pydocstyle — public API docstring coverage
    "N",   # pep8-naming — naming conventions
    "C90", # mccabe — cyclomatic complexity ceiling
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
# Ruff's own default. Nothing in src/ currently exceeds 7, so this is a ceiling
# on future growth rather than a licence to grow to it.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test code idiomatically carries no docstrings (D); unused-arg checks (ARG)
# are noise for fixtures/mocks. Widened to ** to cover nested test packages.
"tests/**" = ["ARG", "D"]
# Runnable example scripts document via module docstrings + inline notes; the
# full pydocstyle surface (per-function Args/Returns) is unnecessary ceremony.
"examples/**" = ["D"]
# The PascalCase property accessors (Id, ResourceType, CreateDate, ModifyDate,
# CustomFields, Name) deliberately mirror the wire format the TP API returns,
# so N802's lowercase rule does not apply to them. They live on the Entity /
# NamedEntity bases in _base.py; models.py is the re-export surface.
"src/targetprocess/_base.py" = ["N802"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
